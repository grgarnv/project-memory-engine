[project]
name = "project-memory-engine"
version = "0.1.0"
description = "A compiler-based system that transforms software artifacts into an evolving model of project understanding."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memory_engine*"]
